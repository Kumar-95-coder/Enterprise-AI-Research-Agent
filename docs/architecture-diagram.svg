<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#34486f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0e7c66"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#faf8f3"/>

  <!-- Layer labels -->
  <text x="20" y="30" font-size="11" fill="#5b6478" letter-spacing="1">LAYER 1 — FRONTEND</text>
  <text x="20" y="100" font-size="11" fill="#5b6478" letter-spacing="1">LAYER 2 — API</text>
  <text x="20" y="200" font-size="11" fill="#5b6478" letter-spacing="1">LAYER 3 — AI PIPELINE (orchestrator.py)</text>
  <text x="20" y="470" font-size="11" fill="#5b6478" letter-spacing="1">LAYER 4 — DATA &amp; KNOWLEDGE</text>
  <text x="20" y="560" font-size="11" fill="#5b6478" letter-spacing="1">LAYER 5 — EXTERNAL / PLUGGABLE PROVIDERS</text>

  <!-- Frontend -->
  <rect x="20" y="40" width="220" height="45" rx="3" fill="#101a2e"/>
  <text x="130" y="68" font-size="13" fill="#faf8f3" text-anchor="middle">Frontend SPA (vanilla JS)</text>
  <line x1="130" y1="85" x2="130" y2="112" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API -->
  <rect x="20" y="112" width="220" height="45" rx="3" fill="#16233c"/>
  <text x="130" y="140" font-size="13" fill="#faf8f3" text-anchor="middle">FastAPI app (main.py + api/*)</text>
  <line x1="130" y1="157" x2="130" y2="210" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="185" font-size="10" fill="#5b6478">POST /api/research</text>

  <!-- Pipeline stages -->
  <g font-size="11.5" fill="#1c2434">
    <!-- stage boxes -->
    <rect x="20" y="212" width="150" height="34" rx="3" fill="#fff" stroke="#d8d2c0"/>
    <text x="95" y="233" text-anchor="middle">Decomposition</text>

    <rect x="190" y="212" width="150" height="34" rx="3" fill="#fff" stroke="#d8d2c0"/>
    <text x="265" y="233" text-anchor="middle">Planning</text>

    <rect x="360" y="212" width="150" height="34" rx="3" fill="#fff" stroke="#d8d2c0"/>
    <text x="435" y="233" text-anchor="middle">Retrieval + Dedup</text>

    <rect x="530" y="212" width="150" height="34" rx="3" fill="#fff" stroke="#d8d2c0"/>
    <text x="605" y="233" text-anchor="middle">Extraction</text>

    <rect x="700" y="212" width="150" height="34" rx="3" fill="#fff" stroke="#d8d2c0"/>
    <text x="775" y="233" text-anchor="middle">Entities/Relations</text>

    <rect x="700" y="256" width="150" height="34" rx="3" fill="#fff" stroke="#d8d2c0"/>
    <text x="775" y="277" text-anchor="middle">Analysis</text>

    <rect x="530" y="256" width="150" height="34" rx="3" fill="#fff" stroke="#d8d2c0"/>
    <text x="605" y="277" text-anchor="middle">Synthesis</text>

    <rect x="360" y="256" width="150" height="34" rx="3" fill="#fff" stroke="#d8d2c0"/>
    <text x="435" y="277" text-anchor="middle">Validation</text>

    <rect x="190" y="256" width="150" height="34" rx="3" fill="#e3f3ee" stroke="#0e7c66"/>
    <text x="265" y="277" text-anchor="middle" fill="#0e7c66" font-weight="600">COMPLETED</text>
  </g>
  <!-- flow arrows for stage row -->
  <line x1="170" y1="229" x2="188" y2="229" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="229" x2="358" y2="229" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="229" x2="528" y2="229" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="229" x2="698" y2="229" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="775" y1="246" x2="775" y2="254" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="273" x2="682" y2="273" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="273" x2="512" y2="273" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="273" x2="342" y2="273" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data layer -->
  <rect x="20" y="330" width="960" height="120" rx="3" fill="#fff" stroke="#d8d2c0"/>
  <text x="500" y="352" font-size="12" fill="#223255" text-anchor="middle" font-weight="600">16-table SQLAlchemy schema (SQLite dev / PostgreSQL prod), Alembic-migrated</text>
  <g font-size="10.5" fill="#34486f">
    <text x="45" y="380">research_jobs</text>
    <text x="45" y="397">sub_questions</text>
    <text x="45" y="414">research_plans</text>

    <text x="200" y="380">sources</text>
    <text x="200" y="397">job_sources</text>
    <text x="200" y="414">findings</text>

    <text x="350" y="380">claims</text>
    <text x="350" y="397">claim_findings</text>
    <text x="350" y="414">contradictions</text>

    <text x="500" y="380">entities</text>
    <text x="500" y="397">relationships</text>
    <text x="500" y="414">conclusions</text>

    <text x="650" y="380">citations</text>
    <text x="650" y="397">research_runs</text>
    <text x="650" y="414">knowledge_vectors</text>

    <rect x="800" y="365" width="150" height="60" rx="3" fill="#e3f3ee" stroke="#0e7c66"/>
    <text x="875" y="390" text-anchor="middle" fill="#0e7c66" font-size="10.5">TF-IDF vector store</text>
    <text x="875" y="405" text-anchor="middle" fill="#0e7c66" font-size="10.5">(semantic search)</text>
  </g>
  <line x1="435" y1="290" x2="435" y2="328" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="605" y1="290" x2="605" y2="328" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="775" y1="290" x2="775" y2="328" stroke="#34486f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Providers -->
  <rect x="20" y="480" width="470" height="120" rx="3" fill="#fff" stroke="#d8d2c0"/>
  <text x="255" y="500" font-size="11.5" font-weight="600" text-anchor="middle">LLMProvider</text>
  <rect x="35" y="510" width="130" height="30" rx="3" fill="#e3f3ee" stroke="#0e7c66"/>
  <text x="100" y="529" font-size="10" text-anchor="middle" fill="#0e7c66">heuristic (default)</text>
  <rect x="175" y="510" width="130" height="30" rx="3" fill="#e3f3ee" stroke="#0e7c66"/>
  <text x="240" y="529" font-size="10" text-anchor="middle" fill="#0e7c66">ollama (keyless)</text>
  <rect x="35" y="548" width="130" height="30" rx="3" fill="#faf0e2" stroke="#b3651a"/>
  <text x="100" y="567" font-size="10" text-anchor="middle" fill="#b3651a">anthropic (key)</text>
  <rect x="175" y="548" width="130" height="30" rx="3" fill="#faf0e2" stroke="#b3651a"/>
  <text x="240" y="567" font-size="10" text-anchor="middle" fill="#b3651a">openai (key)</text>
  <rect x="325" y="510" width="150" height="68" rx="3" fill="#f7f5f0" stroke="#d8d2c0"/>
  <text x="400" y="548" font-size="10" text-anchor="middle" fill="#5b6478">decompose_question()</text>
  <text x="400" y="562" font-size="10" text-anchor="middle" fill="#5b6478">summarize_for_synthesis()</text>

  <rect x="510" y="480" width="470" height="120" rx="3" fill="#fff" stroke="#d8d2c0"/>
  <text x="745" y="500" font-size="11.5" font-weight="600" text-anchor="middle">SearchProvider</text>
  <rect x="525" y="510" width="105" height="30" rx="3" fill="#e3f3ee" stroke="#0e7c66"/>
  <text x="577" y="529" font-size="9.5" text-anchor="middle" fill="#0e7c66">local_corpus</text>
  <rect x="638" y="510" width="105" height="30" rx="3" fill="#e3f3ee" stroke="#0e7c66"/>
  <text x="690" y="529" font-size="9.5" text-anchor="middle" fill="#0e7c66">searxng</text>
  <rect x="525" y="548" width="105" height="30" rx="3" fill="#e3f3ee" stroke="#0e7c66"/>
  <text x="577" y="567" font-size="9.5" text-anchor="middle" fill="#0e7c66">duckduckgo</text>
  <rect x="638" y="548" width="105" height="30" rx="3" fill="#faf0e2" stroke="#b3651a"/>
  <text x="690" y="567" font-size="9.5" text-anchor="middle" fill="#b3651a">live_http (key)</text>
  <rect x="755" y="510" width="215" height="68" rx="3" fill="#f7f5f0" stroke="#d8d2c0"/>
  <text x="862" y="548" font-size="10" text-anchor="middle" fill="#5b6478">search(query, max_results)</text>
  <text x="862" y="562" font-size="10" text-anchor="middle" fill="#5b6478">-&gt; List[candidate source dicts]</text>

  <line x1="435" y1="246" x2="255" y2="478" stroke="#0e7c66" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrowGreen)"/>
  <line x1="605" y1="290" x2="255" y2="478" stroke="#0e7c66" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrowGreen)"/>
  <line x1="435" y1="246" x2="745" y2="478" stroke="#0e7c66" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrowGreen)"/>
</svg>
